<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#2c73b4">
<title>공정이동표 QR 입고</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--blue:#2c73b4;--ink:#24323f;--sub:#7a8794;--line:#d5dde5;--bg:#eef2f6;--ok:#2e8b57;--warn:#d9822b;--bad:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:15px}
header{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:17px}
header small{opacity:.85;font-size:12px}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--blue)}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:60px}
#reader video{border-radius:10px}
.row{display:flex;gap:8px}
.row>*{flex:1}
input,select,button{font:inherit}
input,select{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}
input:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue)}
label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px}
.btn{height:46px;border:0;border-radius:10px;background:#e3e9ef;color:var(--ink);font-weight:700;cursor:pointer;padding:0 14px}
.btn.primary{background:var(--blue);color:#fff}
.btn.ok{background:var(--ok);color:#fff;font-size:17px;height:54px;width:100%}
.btn:disabled{opacity:.5}
.info{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:14px}
.info b{color:var(--sub);font-weight:400}
.big{font-size:19px;font-weight:700}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;cursor:default}
.step.pick{cursor:pointer}
.step.sel{border:2px solid var(--blue);background:#eef5fc}
.step .no{width:24px;height:24px;border-radius:50%;background:#dfe7ee;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 24px}
.step .nm{flex:1;min-width:0}
.step .nm small{display:block;color:var(--sub);font-size:11.5px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:20px;color:#fff;white-space:nowrap}
.t-wait{background:#9aa6b1}.t-out{background:var(--warn)}.t-in{background:var(--blue)}.t-done{background:#6f7d88}
.msg{padding:12px;border-radius:10px;font-size:14px;margin-bottom:12px;display:none}
.msg.show{display:block}
.msg.ok{background:#e4f4ea;color:#1f6b40;border:1px solid #b8e0c6}
.msg.err{background:#fbe9e7;color:#9b2c1f;border:1px solid #f1c3bc}
.msg.info{background:#eef5fc;color:#22578a;border:1px solid #c6dcf0}
.hide{display:none!important}
.small{font-size:12px;color:var(--sub)}
/* 숫자 입력 팝업 */
input.np{cursor:pointer;font-size:20px;font-weight:700;text-align:right;caret-color:transparent;background:#fbfcfd}
#npBg{position:fixed;inset:0;background:rgba(20,30,40,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
#npBg.on{display:flex}
#np{background:#fff;width:100%;max-width:420px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.2)}
#npHd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
#npHd b{font-size:15px}#npHd small{color:var(--sub);font-size:12px}
#npVal{height:62px;border:2px solid var(--blue);border-radius:10px;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;margin-bottom:10px;background:#f5f9fd}
#npVal.ph{color:#b6c2cd}
#npQuick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#npQuick button{flex:1;min-width:70px;height:40px;border:1px solid #c6dcf0;background:#eef5fc;color:#22578a;border-radius:8px;font-weight:700;font-size:14px}
#npKeys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#npKeys button{height:58px;border:0;border-radius:10px;background:#e8edf2;font-size:24px;font-weight:700;color:var(--ink);touch-action:manipulation}
#npKeys button:active{background:#cfd8e1}
#npKeys .fn{background:#dde3ea;font-size:18px}
#npKeys .ok{grid-column:span 2;background:var(--ok);color:#fff;font-size:20px}
#npKeys .cancel{background:#f1f3f5;font-size:17px;color:var(--sub)}
@media (min-width:700px){#npBg{align-items:center}#np{border-radius:16px}}
@media (min-width:700px){main{padding-top:20px}.info{grid-template-columns:90px 1fr}}
</style>
</head>
<body>
<header><div><h1>📥 QR 입고</h1><small>경일FB · SCM Smart</small></div><button class="btn" id="whoBtn" style="height:34px;font-size:13px">👤 <span id="whoTxt"></span></button></header>
<main>
  <div id="msg" class="msg"></div>

  <section class="card" id="scanCard">
    <h2>1. 공정이동표 QR 스캔</h2>
    <div id="reader"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="camBtn">📷 카메라 켜기</button>
    </div>
    <label>또는 로트번호 직접 입력</label>
    <div class="row"><input id="lotIn" placeholder="예: PL-261005-001" autocapitalize="characters"><button class="btn" id="lotBtn" style="flex:0 0 80px">조회</button></div>
  </section>

  <section class="card hide" id="itemCard">
    <h2>품번 <span id="vItemCd"></span> — 입고할 로트 선택</h2>
    <div class="steps" id="itemLots"></div>
  </section>

  <section class="card hide" id="lotCard">
    <h2>2. 로트 정보</h2>
    <div class="info">
      <b>가공 LOT</b><span class="big" id="vLot"></span>
      <b>품번</b><span id="vItem"></span>
      <b>로트수량</b><span id="vQty"></span>
    </div>
    <div class="steps" id="steps"></div>
  </section>

  <section class="card hide" id="inCard">
    <h2>3. 입고수량 등록</h2>
    <div class="info" style="margin-bottom:4px">
      <b>공정</b><span id="vProc" class="big"></span>
      <b>가공처</b><span id="vSite"></span>
      <b>수량</b><span id="vOut"></span>
    </div>
    <div class="row">
      <div><label>입고수량</label><input id="inQty" class="np" readonly inputmode="none" data-label="입고수량"></div>
      <div><label>불량</label><input id="ngQty" class="np" readonly inputmode="none" value="0" data-label="불량"></div>
    </div>
    <label>입고일</label><input id="inDate" type="date">
    <div style="margin-top:14px"><button class="btn ok" id="saveBtn">✔ 입고 등록</button></div>
    <p class="small" style="margin:8px 0 0">등록하면 이 공정이 '입고' 상태로 바뀌고 사무실 가공진행 화면에 바로 반영됩니다.</p>
  </section>

  <section class="card hide" id="confCard">
    <h2>입고확정</h2>
    <div class="info" style="margin-bottom:8px">
      <b>공정</b><span id="cProc" class="big"></span>
      <b>입고</b><span id="cQty"></span>
    </div>
    <div id="cWarn" class="small" style="color:#b45309;margin-bottom:8px"></div>
    <button class="btn ok" id="confBtn" style="background:#2c73b4">✔ 입고확정</button>
    <p class="small" style="margin:8px 0 0">확정하면 양품 수량이 다음 공정으로 넘어갑니다. 확정 후 나머지가 들어오면 확정이 풀리고 다시 확정해야 합니다.</p>
  </section>

  <div class="row hide" id="nextRow"><button class="btn primary" id="nextBtn">📷 다음 이동표 스캔</button></div>
</main>

<div id="npBg"><div id="np">
  <div id="npHd"><b id="npTitle"></b><small id="npHint"></small></div>
  <div id="npVal"></div>
  <div id="npQuick"></div>
  <div id="npKeys">
    <button>7</button><button>8</button><button>9</button>
    <button>4</button><button>5</button><button>6</button>
    <button>1</button><button>2</button><button>3</button>
    <button class="fn" data-k="C">C</button><button>0</button><button class="fn" data-k="BS">⌫</button>
    <button class="cancel" data-k="X">취소</button><button class="ok" data-k="OK">확인</button>
  </div>
</div></div>

<script>
const URL_='https://jgvikmakenpllwxwdugk.supabase.co/rest/v1/';
const KEY='sb_publishable_sKp-6nz2PQ9LxQ5pF-nYkg_YwoEJN6S';
const HOME='KI01';
const $=id=>document.getElementById(id);
const N=v=>{const n=Number(v);return isNaN(n)?0:n};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const nowIso=()=>new Date().toISOString();
const mvNo=()=>'MV-'+today().replace(/-/g,'').slice(2)+'-'+Date.now().toString(36).slice(-5).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase();
const LSW='scm_qr_worker';
let WHO='';try{WHO=localStorage.getItem(LSW)||''}catch(e){}
function setWho(){const n=prompt('작업자 이름을 입력하세요',WHO||'');if(n&&n.trim()){WHO=n.trim();try{localStorage.setItem(LSW,WHO)}catch(e){}}$('whoTxt').textContent=WHO||'작업자'}
$('whoBtn').onclick=setWho;$('whoTxt').textContent=WHO||'작업자';

async function api(path,opt={}){
  const r=await fetch(URL_+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',...(opt.headers||{})}});
  const t=await r.text();const b=t?JSON.parse(t):null;
  if(!r.ok)throw new Error((b&&(b.message||b.hint))||('HTTP '+r.status));
  return b}
const get=(t,q)=>api(t+'?'+q,{headers:{'Cache-Control':'no-cache'}});

function show(type,html){const m=$('msg');m.className='msg show '+type;m.innerHTML=html;m.scrollIntoView({behavior:'smooth',block:'start'})}
function hideMsg(){$('msg').className='msg'}

/* ── QR 스캔 ── */
let QR=null,scanning=false,busy=false;
async function startCam(){
  if(scanning)return stopCam();
  hideMsg();
  try{
    QR=QR||new Html5Qrcode('reader');
    await QR.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},onScan,()=>{});
    scanning=true;$('camBtn').textContent='■ 카메라 끄기';
    try{const tr=QR.getRunningTrackCameraCapabilities?.();const z=tr&&tr.zoomFeature&&tr.zoomFeature();if(z&&z.isSupported())z.apply(Math.min(2,z.max()))}catch(e){}
  }catch(e){show('err','카메라를 켤 수 없습니다. 브라우저 카메라 권한을 허용해 주세요.<br><small>'+esc(e.message||e)+'</small>')}}
async function stopCam(){if(QR&&scanning){try{await QR.stop()}catch(e){}}scanning=false;$('camBtn').textContent='📷 카메라 켜기'}
$('camBtn').onclick=startCam;

async function onScan(text){
  if(busy)return;busy=true;
  const t=String(text||'').trim(),p=t.split('|');
  let lot='',item='';
  if(p[0]==='TRAVEL'&&p[1])lot=p[1];
  else if(/^https?:\/\//i.test(t)){try{const u=new URL(t).searchParams;lot=(u.get('lot')||'').toUpperCase();item=u.get('item')||''}catch(e){}}
  else if(/^PL-\d{6}-\d+$/i.test(t))lot=t.toUpperCase();
  else if(t&&t.length<=40&&!/\s/.test(t))item=t.split('_').pop();   /* 옛 도면 QR(품번 글자) */
  if(!lot&&!item){show('err','공정이동표·도면 QR이 아닙니다.<br><small>'+esc(t)+'</small>');setTimeout(()=>busy=false,1500);return}
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  await stopCam();
  if(lot)await loadLot(lot,t);else await loadItem(item,t);busy=false}
$('lotBtn').onclick=()=>{const v=$('lotIn').value.trim().toUpperCase();if(v)loadLot(v,'')};
$('lotIn').onkeydown=e=>{if(e.key==='Enter')$('lotBtn').click()};

/* ── 품번 QR(가공공정도면): 그 품번의 미입고 로트 목록 → 하나 고르면 입고 ── */
async function loadItem(cd,qr){
  hideMsg();['lotCard','inCard','nextRow'].forEach(i=>$(i).classList.add('hide'));
  try{
    const lots=await get('prod_lot','select=lot_no,lot_qty,status&item_cd=eq.'+encodeURIComponent(cd)+'&status=neq.종료&order=lot_no');
    if(!lots.length){$('itemCard').classList.add('hide');show('err','품번 <b>'+esc(cd)+'</b> 의 진행 중인 로트가 없습니다.');return}
    const ps=await get('lot_process','select=lot_no,seq,proc_nm,site_cd,inout_type,status,out_qty,in_qty&lot_no=in.('+lots.map(l=>'"'+l.lot_no+'"').join(',')+')&order=seq');
    if(!Object.keys(SITES).length)(await get('process_site','select=site_cd,site_nm,site_type')).forEach(s=>SITES[s.site_cd]=s);
    const L=lots.map(l=>({l,a:ps.filter(x=>x.lot_no===l.lot_no&&canPick(x))})).filter(x=>x.a.length);
    $('vItemCd').textContent=cd;$('itemCard').classList.remove('hide');
    if(!L.length){$('itemLots').innerHTML='<div class="small">입고·확정할 로트가 없습니다.</div>';$('nextRow').classList.remove('hide');return}
    $('itemLots').innerHTML=L.map(x=>'<div class="step pick" data-lot="'+esc(x.l.lot_no)+'"><span class="nm"><b>'+esc(x.l.lot_no)+'</b><small>'+x.a.map(s=>N(s.seq)+'공정 '+esc(s.proc_nm)+' · '+esc(s.inout_type==='사내'?'사내':sname(s.site_cd))+(canIn(s)?' · 미입고 '+pendOf(s):' · 입고확정 대기')).join('<br>')+'</small></span><span class="tag '+(x.a.some(canIn)?'t-out">입고':'t-in">확정')+'</span></div>').join('');
    $('itemLots').querySelectorAll('.step').forEach(el=>el.onclick=()=>{$('itemCard').classList.add('hide');loadLot(el.dataset.lot,qr)});
    if(L.length===1){$('itemCard').classList.add('hide');loadLot(L[0].l.lot_no,qr)}
  }catch(e){show('err','조회 실패: '+esc(e.message||e))}}

/* ── 로트 조회 ── */
let CUR=null,SITES={};
const ST={'대기':['대기','t-wait'],'반출':['발주(가공중)','t-out'],'가공중':['발주(가공중)','t-out'],'본사입고':['입고','t-in'],'완료':['입고확정','t-done']};
async function loadLot(lot,qr){
  hideMsg();['inCard','confCard','nextRow'].forEach(i=>$(i).classList.add('hide'));const keep=CUR&&CUR.sel&&CUR.sel.proc_id;
  try{
    const [lots,ps,mv,sites]=await Promise.all([
      get('prod_lot','select=*&lot_no=eq.'+encodeURIComponent(lot)),
      get('lot_process','select=*&lot_no=eq.'+encodeURIComponent(lot)+'&order=seq'),
      get('lot_move','select=proc_id,move_type,from_site,to_site,move_qty&lot_no=eq.'+encodeURIComponent(lot)),
      Object.keys(SITES).length?Promise.resolve(null):get('process_site','select=site_cd,site_nm,site_type')]);
    if(sites)sites.forEach(s=>SITES[s.site_cd]=s);
    if(!lots.length){$('lotCard').classList.add('hide');show('err','로트 <b>'+esc(lot)+'</b> 를 찾을 수 없습니다.');return}
    const l=lots[0],act=ps.filter(canPick);
    CUR={lot:l,ps,mv,act,qr,sel:act.find(x=>x.proc_id===keep)||act.find(canIn)||act[0]||null};
    $('vLot').textContent=l.lot_no;$('vItem').textContent=l.item_cd||'';$('vQty').textContent=N(l.lot_qty).toLocaleString();
    $('lotCard').classList.remove('hide');renderSteps();
    if(!act.length){show('info','이 로트에는 지금 <b>입고·확정할 공정이 없습니다.</b><br><small>미입고가 남은 공정은 입고, 입고된 공정은 입고확정을 할 수 있습니다.</small>');$('nextRow').classList.remove('hide');return}
    if(act.length>1)show('info','처리할 공정이 '+act.length+'개입니다. 아래에서 공정을 선택하세요.');
    pick(CUR.sel)
  }catch(e){show('err','조회 실패: '+esc(e.message||e))}}
const pendOf=x=>Math.max(0,N(x.out_qty)-N(x.in_qty));
const canIn=x=>!!x.status&&x.status!=='대기'&&pendOf(x)>0;
const canConf=x=>x.status==='본사입고';
const canPick=x=>canIn(x)||canConf(x);
/* 가공처별 발주·입고·미입고 (사무실 화면 siteBook 과 같은 계산) */
function siteBook(p,mv){const bk={},g=c=>bk[c]||(bk[c]={sent:0,recv:0,pend:0});let so=0,ri=0;
  mv.filter(m=>m.proc_id===p.proc_id).forEach(m=>{if(m.move_type==='반출'||m.move_type==='사내투입'){g(m.to_site||p.site_cd).sent+=N(m.move_qty);so+=N(m.move_qty)}
   else if(m.move_type==='본사입고'||m.move_type==='사내완료'){g(m.move_type==='사내완료'?HOME:(m.from_site||p.site_cd)).recv+=N(m.move_qty);ri+=N(m.move_qty)}});
  const us=N(p.out_qty)-so,ur=N(p.in_qty)-ri;if(us>0)g(p.site_cd).sent+=us;if(ur>0)g(p.site_cd).recv+=ur;if(!Object.keys(bk).length)g(p.site_cd);
  Object.values(bk).forEach(v=>v.pend=Math.max(0,v.sent-v.recv));return bk}
function sname(cd){const s=SITES[cd];return s?s.site_nm:(cd||'')}
function renderSteps(){
  $('steps').innerHTML=CUR.ps.map(x=>{const s=ST[x.status]||[x.status||'대기','t-wait'],can=CUR.act.includes(x);
    return '<div class="step'+(can?' pick':'')+(CUR.sel===x?' sel':'')+'" data-id="'+esc(x.proc_id)+'"><span class="no">'+N(x.seq)+'</span><span class="nm"><b>'+esc(x.proc_nm)+'</b><small>'+esc(x.inout_type==='사내'?'사내 가공':sname(x.site_cd))+(x.out_qty!=null?' · 발주 '+N(x.out_qty):'')+(x.in_qty!=null?' · 입고 '+N(x.in_qty):'')+(canIn(x)?' · <b style="color:#d9822b">미입고 '+pendOf(x)+'</b>':'')+'</small></span><span class="tag '+s[1]+'">'+s[0]+'</span></div>'}).join('')||'<div class="small">등록된 가공공정이 없습니다.</div>';
  $('steps').querySelectorAll('.step.pick').forEach(el=>el.onclick=()=>pick(CUR.ps.find(x=>x.proc_id===el.dataset.id)))}
function pick(p){if(!p)return;CUR.sel=p;renderSteps();
  /* 입고확정 카드 */
  const cf=$('confCard');if(canConf(p)){const g=Math.max(0,N(p.in_qty)-N(p.ng_qty));$('cProc').textContent=N(p.seq)+'공정 · '+(p.proc_nm||'');
   $('cQty').innerHTML=N(p.in_qty).toLocaleString()+(N(p.ng_qty)?' · 불량 '+N(p.ng_qty):'')+' → <b>양품 '+g.toLocaleString()+'</b>';
   $('cWarn').textContent=pendOf(p)>0?'⚠ 아직 미입고 '+pendOf(p).toLocaleString()+' 이(가) 남아 있습니다. 지금 확정하면 들어온 수량만 확정됩니다.':'';$('confBtn').disabled=false;cf.classList.remove('hide')}else cf.classList.add('hide');
  if(!canIn(p)){$('inCard').classList.add('hide');setTimeout(()=>cf.scrollIntoView({behavior:'smooth',block:'start'}),50);return}
  const nm=c=>c===HOME?'사내 가공':sname(c),bk=Object.entries(siteBook(p,CUR.mv)).filter(([c,v])=>v.pend>0);
  $('vProc').textContent=N(p.seq)+'공정 · '+(p.proc_nm||'');$('vOut').textContent=N(p.out_qty).toLocaleString()+' · 기입고 '+N(p.in_qty).toLocaleString()+' · 미입고 '+pendOf(p).toLocaleString();
  if(bk.length>1){$('vSite').innerHTML='<select id="fromSel">'+bk.map(([c,v])=>'<option value="'+esc(c)+'" data-p="'+v.pend+'">'+esc(nm(c))+' — 미입고 '+v.pend+'</option>').join('')+'</select>';
   const fs=$('fromSel');fs.onchange=()=>{$('inQty').value=fs.selectedOptions[0].dataset.p};$('inQty').value=bk[0][1].pend}
  else{const c=bk.length?bk[0][0]:(p.inout_type==='사내'?HOME:p.site_cd);$('vSite').textContent=nm(c);$('vSite').dataset.c=c;$('inQty').value=pendOf(p)}
  $('ngQty').value=0;$('inDate').value=today();
  $('inCard').classList.remove('hide');$('saveBtn').disabled=false;
  setTimeout(()=>$('inCard').scrollIntoView({behavior:'smooth',block:'start'}),50)}

/* 로트 현재상태 갱신 (사무실 화면 updLot 과 같은 규칙) */
async function updLotQR(p,row){
  const ps2=CUR.ps.map(x=>x.proc_id===p.proc_id?row:x).sort((a,b)=>N(a.seq)-N(b.seq));
  let cs=0,cq=N(CUR.lot.lot_qty);ps2.forEach(x=>{if(x.status==='완료'){cs=N(x.seq);cq=Math.max(0,N(x.in_qty)-N(x.ng_qty))}});
  const act=ps2.find(x=>x.status==='반출'||x.status==='가공중');
  const gd=x=>Math.max(0,N(x.in_qty)-N(x.ng_qty)),fin=ps2.length>0&&ps2.every((x,i)=>x.status==='완료'&&N(x.out_qty)<=N(x.in_qty)&&(i?gd(ps2[i-1]):N(CUR.lot.lot_qty))-N(x.out_qty)<=0);
  await api('prod_lot?lot_no=eq.'+encodeURIComponent(p.lot_no),{method:'PATCH',headers:{Prefer:'return=minimal'},
    body:JSON.stringify({cur_seq:cs,remain_qty:cq,cur_site:act?act.site_cd:HOME,status:fin?'가공완료':'가공중',updated_at:nowIso(),updated_by:WHO})})}

/* ── 입고확정 (사무실 '입고확정'과 같은 처리) ── */
$('confBtn').onclick=async()=>{
  const p=CUR&&CUR.sel;if(!p||!canConf(p))return;
  if(!WHO){setWho();if(!WHO)return}
  const g=Math.max(0,N(p.in_qty)-N(p.ng_qty));
  if(!confirm(p.lot_no+' · '+N(p.seq)+'공정 '+(p.proc_nm||'')+'\n입고 '+N(p.in_qty)+(N(p.ng_qty)?' (불량 '+N(p.ng_qty)+')':'')+' → 양품 '+g+' 입고확정할까요?'+(pendOf(p)>0?'\n(미입고 '+pendOf(p)+' 남음)':'')))return;
  $('confBtn').disabled=true;
  try{const d=today();
    const upd=await api('lot_process?proc_id=eq.'+encodeURIComponent(p.proc_id)+'&status=eq.'+encodeURIComponent('본사입고')+'&in_qty='+(p.in_qty==null?'is.null':'eq.'+N(p.in_qty)),{method:'PATCH',headers:{Prefer:'return=representation'},
      body:JSON.stringify({status:'완료',done_date:d,confirm_yn:true,confirm_by:WHO,confirm_date:d,updated_at:nowIso(),updated_by:WHO})});
    if(!upd||!upd.length){show('err','그 사이 다른 곳에서 처리되었습니다. 다시 조회했으니 확인하세요.');return loadLot(p.lot_no,CUR.qr)}
    await updLotQR(p,upd[0]);
    try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
    await loadLot(p.lot_no,CUR.qr);show('ok','✔ <b>'+esc(p.lot_no)+'</b> '+N(p.seq)+'공정 '+esc(p.proc_nm||'')+' 입고확정 — 양품 '+g.toLocaleString()+' 다음 공정 발주 가능');$('nextRow').classList.remove('hide');
  }catch(e){show('err','확정 실패: '+esc(e.message||e));$('confBtn').disabled=false}};

/* ── 입고 등록 (사무실 가공진행 화면의 '입고'와 같은 처리) ── */
$('saveBtn').onclick=async()=>{
  const p=CUR&&CUR.sel;if(!p)return;
  const q=N($('inQty').value),ng=N($('ngQty').value),dt=$('inDate').value||today();
  if(q<=0)return alert('입고수량을 입력하세요.');
  if(ng<0||ng>q)return alert('불량 수량이 입고수량보다 클 수 없습니다.');
  const fs=$('fromSel'),from=fs?fs.value:($('vSite').dataset.c||p.site_cd);
  const lim=fs?N(fs.selectedOptions[0].dataset.p):pendOf(p);
  if(q>lim)return alert('입고수량('+q+')이 미입고 수량('+lim+')보다 많습니다.\n초과입고는 받지 않습니다. 더 들어온 수량은 사무실에서 [추가발주] 후 입고하세요.');
  if(!WHO){setWho();if(!WHO)return}
  if(!confirm(p.lot_no+' · '+N(p.seq)+'공정 '+(p.proc_nm||'')+'\n입고 '+q+(ng?' (불량 '+ng+')':'')+' 등록할까요?'))return;
  $('saveBtn').disabled=true;
  try{
    /* 부분입고 누적: 기입고 + 이번 입고. 그 사이 다른 곳에서 입고했으면(기입고 값이 바뀌면) 저장 안 됨 */
    const guard=p.in_qty==null?'is.null':'eq.'+N(p.in_qty);
    const upd=await api('lot_process?proc_id=eq.'+encodeURIComponent(p.proc_id)+'&in_qty='+guard,{method:'PATCH',headers:{Prefer:'return=representation'},
      body:JSON.stringify({status:'본사입고',in_date:dt,in_qty:N(p.in_qty)+q,ng_qty:N(p.ng_qty)+ng,done_date:null,confirm_yn:false,confirm_by:null,confirm_date:null,updated_at:nowIso(),updated_by:WHO})});
    if(!upd||!upd.length){show('err','그 사이 다른 곳에서 입고 처리되었습니다. 다시 조회했으니 확인 후 등록하세요.');return loadLot(p.lot_no,CUR.qr)}
    const inh=from===HOME;
    await api('lot_move',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify([{move_no:mvNo(),lot_no:p.lot_no,proc_id:p.proc_id,move_type:inh?'사내완료':'본사입고',
      from_site:from,to_site:HOME,move_qty:q,ng_qty:ng||null,move_date:dt,worker:WHO,scan_method:'QR',scan_qr:CUR.qr||null,scan_site_cd:HOME,seq:N(p.seq),
      created_at:nowIso(),created_by:WHO,updated_at:nowIso(),updated_by:WHO}])});
    await updLotQR(p,upd[0]);
    try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
    show('ok','✔ <b>'+esc(p.lot_no)+'</b> '+N(p.seq)+'공정 '+esc(p.proc_nm||'')+' 입고 등록 완료<br>입고 '+q.toLocaleString()+(ng?' · 불량 '+ng:''));
    $('inCard').classList.add('hide');$('nextRow').classList.remove('hide');
    return loadLot(p.lot_no,CUR.qr).then(()=>{show('ok','✔ <b>'+esc(p.lot_no)+'</b> '+N(p.seq)+'공정 '+esc(p.proc_nm||'')+' 입고 등록 완료<br>입고 '+q.toLocaleString()+(ng?' · 불량 '+ng:'')+(CUR.sel&&canConf(CUR.sel)?'<br><small>아래에서 바로 입고확정할 수 있습니다.</small>':''));$('nextRow').classList.remove('hide')});
  }catch(e){show('err','등록 실패: '+esc(e.message||e));$('saveBtn').disabled=false}};
$('nextBtn').onclick=()=>{hideMsg();$('lotCard').classList.add('hide');$('confCard').classList.add('hide');$('itemCard').classList.add('hide');$('nextRow').classList.add('hide');$('lotIn').value='';window.scrollTo(0,0);startCam()};

/* ── 숫자 입력 팝업 (현장용 큰 버튼) ── */
let NP=null;
function npShow(){const v=NP.buf;$('npVal').textContent=v===''?'0':Number(v).toLocaleString();$('npVal').classList.toggle('ph',v==='')}
function openPad(inp){
  const p=CUR&&CUR.sel,pend=p?pendOf(p):0,isNg=inp.id==='ngQty',iq=N($('inQty').value);
  NP={inp,buf:'',first:true};
  $('npTitle').textContent=inp.dataset.label;
  $('npHint').textContent=isNg?'입고수량 '+iq.toLocaleString()+' 중':'미입고 '+pend.toLocaleString();
  const q=isNg?[0]:[...new Set([pend,N(inp.value)].filter(x=>x>0))];
  $('npQuick').innerHTML=q.map(x=>'<button data-q="'+x+'">'+(isNg?'불량 없음 (0)':(x===pend?'미입고 전량 ':'')+x.toLocaleString())+'</button>').join('');
  $('npQuick').querySelectorAll('button').forEach(b=>b.onclick=()=>{inp.value=b.dataset.q;closePad()});
  NP.buf=String(N(inp.value)||'');npShow();$('npBg').classList.add('on')}
function closePad(){$('npBg').classList.remove('on');NP=null}
document.querySelectorAll('input.np').forEach(el=>{el.addEventListener('click',e=>{e.preventDefault();el.blur();openPad(el)});el.addEventListener('focus',()=>el.blur())});
$('npKeys').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!NP)return;const k=b.dataset.k||b.textContent;
  if(k==='X')return closePad();
  if(k==='OK'){NP.inp.value=N(NP.buf);return closePad()}
  if(k==='C')NP.buf='';else if(k==='BS')NP.buf=NP.first?'':NP.buf.slice(0,-1);
  else{if(NP.first)NP.buf='';NP.buf=(NP.buf+k).replace(/^0+(?=\d)/,'').slice(0,7)}
  NP.first=false;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}npShow()});
$('npBg').onclick=e=>{if(e.target.id==='npBg')closePad()};

const QS=new URLSearchParams(location.search),qp=QS.get('lot'),qi=QS.get('item');if(qp)loadLot(qp.toUpperCase(),location.href);else if(qi)loadItem(qi,location.href);
</script>
